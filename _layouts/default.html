<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

 <style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b132b;
    color: #ffffff;
    text-align: center;
  }

  .site-header {
    padding: 30px 20px;
  }

  .site-logo {
    max-width: 180px;
    margin-bottom: 10px;
  }

  .site-nav a {
    margin: 0 10px;
    color: #00e5ff;
    text-decoration: none;
    font-weight: bold;
  }

  .site-nav a:hover {
    text-decoration: underline;
  }

  .site-tagline {
    margin-top: 10px;
    font-size: 14px;
    opacity: 0.8;
  }

  .site-content {
    padding: 40px 20px;
  }

  .site-footer {
    margin-top: 40px;
    padding: 20px;
    font-size: 13px;
    opacity: 0.6;
  }
</style>

</head>
<body>

  <header class="site-header">
    <img src="/assets/images/LOGOSTARS2.png" alt="RadioStars FM" class="site-logo">

    <nav class="site-nav">
      <a href="/">Beranda</a>
      <a href="/radio">Radio Live</a>
      <a href="/berita">Berita</a>
      <a href="/tentang">Tentang</a>
    </nav>

    <p class="site-tagline">Portal Berita & Radio Streaming</p>
  </header>

  <main class="site-content">
    {{ content }}
  </main>

  <footer class="site-footer">
    © {{ site.time | date: "%Y" }} RadioStars FM
  </footer>

</body>

</html>
