<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0a0f1c;
      color: #fff;
    }
    header {
      text-align: center;
      padding: 40px 20px;
    }
    header img {
      max-width: 220px;
    }
    main {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }
    footer {
      text-align: center;
      padding: 20px;
      opacity: 0.6;
      font-size: 14px;
    }
  </style>
</head>
<body>

<header>
  <img src="/LOGOSTARS2.png" alt="RadioStars FM">
  <p>{{ site.description }}</p>
</header>

<main>
  {{ content }}
</main>

<footer>
  © {{ site.time | date: "%Y" }} RadioStars FM
</footer>

</body>
</html>
